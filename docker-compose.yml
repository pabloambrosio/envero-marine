# Stack local de base de datos. Reemplaza al stack de Supabase como flujo
# local-first: `yarn db:up` y a trabajar. mysql:8 porque es lo que corre
# HostGator Business (verificar versión exacta en cPanel antes del deploy).
# Puerto 3310 en el host para no chocar con un MySQL local en 3306.
services:
  db:
    image: mysql:8
    container_name: envero-marine-mysql
    environment:
      MYSQL_DATABASE: envero_marine
      MYSQL_USER: envero
      MYSQL_PASSWORD: envero
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Grants para la shadow DB de `prisma migrate dev` (solo primera init)
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql:ro

volumes:
  mysql-data:
